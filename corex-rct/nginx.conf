# Serves the built SPA and reverse-proxies API/media calls to the backend,
# so the frontend image needs no host-specific config baked in.
#
# This is a template: the nginx image fills in ${...} from the environment at
# container start (/etc/nginx/templates). Only variables that exist in the
# environment are replaced, so nginx's own $uri, $host etc. are left alone.
#   BACKEND_UPSTREAM       backend host:port. Docker Compose: backend:8000.
#                          Kubernetes: the full service name, e.g.
#                          backend.corex.svc.cluster.local:8000 (nginx's
#                          resolver does not use the pod's DNS search list).
#   NGINX_LOCAL_RESOLVERS  DNS servers, read from /etc/resolv.conf by the image
#                          (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 in the Dockerfile):
#                          127.0.0.11 under Docker, the cluster DNS under Kubernetes.

# TLS often ends before this server (a load balancer or Kubernetes ingress). Pass
# its X-Forwarded-Proto through so Django knows the browser used https;
# otherwise HTTPS_ENABLED=True would redirect forever.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Room photos, logos and documents (nginx's default is 1 MB).
    client_max_body_size 20m;

    # Security headers. NOTE: nginx drops server-level add_header lines inside
    # any location that has its own add_header, so they're repeated below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(self \"https://checkout.razorpay.com\")" always;

    # Resolve the backend at request time (via the $upstream_backend variable
    # below) instead of once at startup. A plain `proxy_pass http://backend:8000`
    # resolves only at config load, so nginx refuses to start if the backend
    # isn't up yet, and won't notice if it comes back with a new IP.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # Kubernetes liveness/readiness for this container (no backend involved).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routing (react-router) - let unknown paths fall through
    # to index.html instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $upstream_backend ${BACKEND_UPSTREAM};
        # No URI after the host: with a variable in proxy_pass, a URI here
        # would REPLACE the request path (every call would reach /api/).
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $http_x_request_id;
        # Streaming chat replies (server-sent events) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location /media/ {
        set $upstream_backend ${BACKEND_UPSTREAM};
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Static assets get long-lived caching; index.html itself must not be
    # cached so deploys are picked up on next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(self \"https://checkout.razorpay.com\")" always;
    }
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), payment=(self \"https://checkout.razorpay.com\")" always;
    }
}
