# Serves the built SPA and reverse-proxies API/media calls to the backend
# container, so the frontend image needs no host-specific config baked in.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — resolves "backend" at request time (via the
    # $upstream_backend variable below) instead of once at nginx startup.
    # A plain `proxy_pass http://backend:8000` resolves only at config load,
    # so nginx refuses to start if the backend container isn't up yet, and
    # won't notice if it restarts with a new IP.
    resolver 127.0.0.11 valid=10s;

    # Client-side routing (react-router) — let unknown paths fall through
    # to index.html instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $upstream_backend backend:8000;
        proxy_pass http://$upstream_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        set $upstream_backend backend:8000;
        proxy_pass http://$upstream_backend/media/;
        proxy_set_header Host $host;
    }

    # Static assets get long-lived caching; index.html itself must not be
    # cached so deploys are picked up on next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
