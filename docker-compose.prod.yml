# Production-style stack — images build with baked-in code (no bind mounts),
# gunicorn/uvicorn (no --reload), nginx serving the compiled frontend.
#
#   cp .env.prod.example .env.prod                    # fill in real secrets
#   cp orchestrator/.env.prod.example orchestrator/.env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# Notable differences from docker-compose.yml (dev):
#   - `target: prod` on every custom image (see each Dockerfile)
#   - no source bind mounts — you must rebuild (`--build`) to ship a code change
#   - frontend is nginx serving `npm run build` output, not the CRA dev server
#   - DEBUG=False, so ALLOWED_HOSTS / SECRET_KEY / DB_PASSWORD must be set for
#     real in .env.prod — see .env.prod.example
#   - db/redis ports are not published to the host by default (uncomment if
#     you need direct psql/redis-cli access)

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-corex_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-corex_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: always
    env_file:
      - .env.prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      LLM_ORCHESTRATOR_URL: http://orchestrator:8002
      DEBUG: "False"
      # Read at container-start by backend-entrypoint.sh to seed the
      # django-tenants public Domain row — must match a hostname clients
      # actually hit this through (i.e. one of ALLOWED_HOSTS below), NOT
      # "localhost" (that's only correct for docker-compose.yml/dev).
      # Required — fails fast rather than silently seeding the wrong domain.
      PUBLIC_TENANT_DOMAIN: ${PUBLIC_TENANT_DOMAIN:?set PUBLIC_TENANT_DOMAIN in .env.prod (e.g. your production domain)}
      # nginx (frontend container) sits in front of Django — needed for correct per-IP rate limits.
      TRUSTED_PROXY_COUNT: 1
      # Production defaults (override in .env.prod if needed):
      CACHE_USE_REDIS: ${CACHE_USE_REDIS:-True}                       # shared lockouts / rate limits
      BOOKING_EMAILS_VIA_CELERY: ${BOOKING_EMAILS_VIA_CELERY:-True}   # emails retried by the worker
      LOG_FORMAT: ${LOG_FORMAT:-json}
    healthcheck:
      # Ready = database, Redis and file storage all answer (see apps/core/health.py).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/ready/', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      # All uploads (photos, logos, covers, documents) — one persistent volume.
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    command: celery -A corex worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    restart: always
    env_file:
      - .env.prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
      SKIP_MIGRATE: "1" # backend already migrates; avoid a race between the two
      CACHE_USE_REDIS: ${CACHE_USE_REDIS:-True}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      # All uploads (photos, logos, covers, documents) — one persistent volume.
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # Scheduler for periodic jobs (e.g. expiring unpaid bookings). Run exactly ONE.
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    command: celery -A corex beat -l info --schedule /tmp/celerybeat-schedule
    restart: always
    env_file:
      - .env.prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
      SKIP_MIGRATE: "1"
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
      target: prod
    restart: always
    env_file:
      - ./orchestrator/.env.prod
    environment:
      DJANGO_API_BASE_URL: http://backend:8000
      # Only takes effect if orchestrator/.env.prod also sets
      # MEMORY_BACKEND=redis — see the note in docker-compose.yml.
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./corex-rct
      dockerfile: Dockerfile
      target: prod
      args:
        # Relative path — nginx.conf proxies /api to the backend container,
        # so the browser never needs to know the backend's real host.
        REACT_APP_API_URL: /api
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  media:
