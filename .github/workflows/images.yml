name: Images

# Builds the three production images and pushes them to GitHub Container
# Registry, tagged with the commit SHA (deploy this) and "latest".
#   ghcr.io/<owner>/corex-backend | corex-frontend | corex-orchestrator
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: corex-backend
            context: .
          - image: corex-frontend
            context: corex-rct
          - image: corex-orchestrator
            context: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
            ${{ steps.name.outputs.ref }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
