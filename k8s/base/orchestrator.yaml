# AI chat orchestrator (FastAPI). Internal only: a ClusterIP Service with no
# Ingress, and a NetworkPolicy (network-policies.yaml) that lets only the
# backend pods call it. It trusts the user headers Django forwards, so it must
# never be reachable from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector:
    app.kubernetes.io/name: corex
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: 8002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: corex
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corex
        app.kubernetes.io/component: orchestrator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: corex-orchestrator
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef: {name: orchestrator-config}
            # LLM_PROVIDER and the provider's API key.
            - secretRef: {name: orchestrator-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
