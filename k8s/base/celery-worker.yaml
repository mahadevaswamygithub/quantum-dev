# Background jobs: booking emails (with retries), payment-window expiry...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: corex
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corex
        app.kubernetes.io/component: celery-worker
    spec:
      automountServiceAccountToken: false
      # Warm shutdown: let running tasks finish (tasks are acks_late, so an
      # interrupted one is redelivered rather than lost).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: corex-backend
          args: ["python", "manage.py", "wait_for_migrations", "--timeout", "900"]
          envFrom:
            - configMapRef: {name: corex-config}
            - secretRef: {name: corex-secrets}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: corex-backend
          args: ["celery", "-A", "corex", "worker", "-l", "info", "--concurrency=4"]
          envFrom:
            - configMapRef: {name: corex-config}
            - secretRef: {name: corex-secrets}
          livenessProbe:
            # The worker answers a ping through Redis; a hung worker is restarted.
            exec:
              command: ["sh", "-c", "celery -A corex inspect ping -d celery@$HOSTNAME --timeout 10"]
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 45
            failureThreshold: 3
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
